<!DOCTYPE html>
<html>
<head>
  <title>Online Quiz System</title>
</head>
<body>
  <h2>Online Quiz System</h2>

  <form id="quizForm">
    <p><b>1. Which language runs in a web browser?</b></p>
    <label><input type="radio" name="q1" value="Java"> Java</label><br>
    <label><input type="radio" name="q1" value="C"> C</label><br>
    <label><input type="radio" name="q1" value="JavaScript"> JavaScript</label><br>

    <p><b>2. What does CSS stand for?</b></p>
    <label><input type="radio" name="q2" value="Cascading Style Sheets"> Cascading Style Sheets</label><br>
    <label><input type="radio" name="q2" value="Creative Style System"> Creative Style System</label><br>
    <br>

    <button type="button" onclick="submitQuiz()">Submit Quiz</button>
  </form>

  <h3 id="score"></h3>

  <script>
    function submitQuiz() {
      const answers = {
        q1: "JavaScript",
        q2: "Cascading Style Sheets"
      };

      let score = 0;
      let form = document.getElementById("quizForm");

      for (let q in answers) {
        if (form.elements[q].value === answers[q]) {
          score++;
        }
      }

      document.getElementById("score").textContent =
        "Your Score: " + score + " / 2";
    }
  </script>
</body>
</html>
